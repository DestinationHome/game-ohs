[package]
name = "psh-ohs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "psh-ohs"
path = "src/main.rs"

[features]
default = []
telemetry = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
]

[dependencies]
actix-files = "0.6.10"
actix-web = "4.12.1"
hex = "0.4.3"
lazy_static = "1.5.0"
mongodb = "3.5.1"
rand = "0.9.2"
ranged_integers = "0.11.0"
actix-multipart = "0.4"
serde_json = "1.0"
regex = "1.12.3"
serde = "1.0.228"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
    "time",
    "fmt",
    "ansi",
    "registry",
    "std",
] }
once_cell = "1.20.0"
futures = "0.3.31"
ctor = "0.1"
cap-std = "3.4"
mime_guess = "2.0"

# OpenTelemetry optional dependencies
tracing-opentelemetry = { version = "0.31.0", optional = true }
opentelemetry = { version = "0.30.0", features = [
    "logs",
    "trace",
], optional = true }
opentelemetry-otlp = { version = "0.30.0", features = [
    "logs",
    "grpc-tonic",
], optional = true }
opentelemetry_sdk = { version = "0.30.0", features = [
    "logs",
    "trace",
], optional = true }

# Local dependencies
macros = { path = "../macros" }
jamin = { path = "../jamin" }

# Testing
reqwest = { version = "0.11", features = ["multipart", "json", "rustls-tls"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
dotenv = "0.15.0"
chrono = "0.4.43"
